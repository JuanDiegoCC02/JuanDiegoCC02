name: Generate Comet Contribution Graph

on:
  schedule:
    - cron: "0 3 * * 1"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate Comet Graph
        uses: kiaquila/comet-contribution-graph@v1
        with:
          username: JuanDiegoCC02
